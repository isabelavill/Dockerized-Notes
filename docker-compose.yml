services:
  db:
    image: postgres:16-alpine
    container_name: docker-notes-db
    environment:
      POSTGRES_DB: docker_notes
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: [
        "CMD-SHELL", "pg_isready -U postgres"
      ]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
    container_name: docker-notes-api
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  pg_data:
